[package]
name = "mini-swe-mcp"
version = "0.1.0"
edition = "2024"
description = "High-throughput autonomous SWE subagent server over MCP stdio protocol"
repository = "https://github.com/soyelmismo/mini-swe-mcp"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
regex = "1"
dotenvy = "0.15"
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
